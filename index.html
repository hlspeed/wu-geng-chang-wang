<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>華一江排球團抽籤分組程式</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 800px;
        }
        .column {
            display: flex;
            flex-direction: column;
        }
        input {
            margin: 5px 0;
            padding: 5px;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .groups-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1200px;
        }
        .group {
            margin: 10px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 18%;
            min-width: 150px;
            box-sizing: border-box;
        }
        .group h4 {
            margin-top: 0;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }
        .card {
            border: 2px dashed #888;
            padding: 15px;
            margin: 20px 0;
            width: 100%;
            max-width: 800px;
            background-color: #f9f9f9;
            border-radius: 10px;
        }
        .binding-inputs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }
        .binding-inputs select[multiple] {
            height: 120px;
            min-width: 160px;
            font-size: 14px;
        }
        .binding-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .binding-tag {
            background-color: #4e79a7;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .binding-tag button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            .group {
                width: 80%;
            }
            .binding-inputs {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <h1>華一江排球團</h1>
    <h1>抽籤分組程式</h1>
    <div class="container">
        <div class="column">
            <h2>女生</h2>
            <input type="text" class="female" value="依芸">
            <input type="text" class="female" value="小育">
            <input type="text" class="female" value="阿禪">
            <input type="text" class="female" value="廖禎">
            <input type="text" class="female" value="小霏">
            <input type="text" class="female" value="小美">
            <input type="text" class="female" value="Amber">
            <input type="text" class="female" value="蕭魚">
            <input type="text" class="female" value="婕妤">
            <input type="text" class="female" value="蛋餅">
            <input type="text" class="female" placeholder="女生姓名11">
            <input type="text" class="female" placeholder="女生姓名12">
            <input type="text" class="female" placeholder="女生姓名13">
            <input type="text" class="female" placeholder="女生姓名14">
            <input type="text" class="female" placeholder="女生姓名15">
        </div>
        <div class="column">
            <h2>男生</h2>
            <input type="text" class="male" value="品客">
            <input type="text" class="male" value="J翰">
            <input type="text" class="male" value="Ian">
            <input type="text" class="male" value="瑪莉">
            <input type="text" class="male" value="蚊子">
            <input type="text" class="male" value="子森">
            <input type="text" class="male" value="大腸">
            <input type="text" class="male" value="節哥">
            <input type="text" class="male" placeholder="男生姓名9">
            <input type="text" class="male" placeholder="男生姓名10">
            <input type="text" class="male" placeholder="男生姓名11">
            <input type="text" class="male" placeholder="男生姓名12">
            <input type="text" class="male" placeholder="男生姓名13">
            <input type="text" class="male" placeholder="男生姓名14">
            <input type="text" class="male" placeholder="男生姓名15">
        </div>
    </div>

    <!-- 特殊分組設定 -->
    <div id="special-binding" class="card">
        <h3>🎯 特殊分組設定</h3>
        <div class="binding-inputs">
            <select id="person-select" multiple></select>
            <select id="group-select">
                <option value="A">A 組</option>
                <option value="B">B 組</option>
                <option value="C">C 組</option>
                <option value="D">D 組</option>
                <option value="E">E 組</option>
                <option value="F">F 組</option>
            </select>
            <button onclick="addBinding()">➕ 新增綁定</button>
        </div>
        <div id="binding-tags" class="binding-tags"></div>
    </div>

    <button onclick="startLottery()">開始抽籤分組</button>
    <div id="result"></div>

    <script>
        let lockedGroups = [];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function updatePersonSelect() {
            const inputs = [...document.querySelectorAll('.female'), ...document.querySelectorAll('.male')];
            const select = document.getElementById('person-select');
            select.innerHTML = '';
            const uniqueNames = [...new Set(inputs.map(i => i.value.trim()).filter(n => n))];
            for (const name of uniqueNames) {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                select.appendChild(opt);
            }
        }

        function addBinding() {
            const select = document.getElementById('person-select');
            const group = document.getElementById('group-select').value;
            const selected = Array.from(select.selectedOptions).map(opt => opt.value).filter(n => n);
            if (selected.length === 0) {
                alert('請至少選擇一個人來指定分組！');
                return;
            }
            lockedGroups.push({ members: selected, group });
            renderBindings();
        }

        function renderBindings() {
            const container = document.getElementById('binding-tags');
            container.innerHTML = '';
            lockedGroups.forEach((binding, idx) => {
                const tag = document.createElement('div');
                tag.className = 'binding-tag';
                tag.innerHTML = `[${binding.members.join(', ')}] → ${binding.group} 組 <button onclick="removeBinding(${idx})">❌</button>`;
                container.appendChild(tag);
            });
        }

        function removeBinding(index) {
            lockedGroups.splice(index, 1);
            renderBindings();
        }

        function startLottery() {
            updatePersonSelect();

            // Get all names from inputs
            let females = Array.from(document.querySelectorAll('.female')).map(i => i.value.trim()).filter(n => n);
            let males = Array.from(document.querySelectorAll('.male')).map(i => i.value.trim()).filter(n => n);
            
            const groups = { A: [], B: [], C: [], D: [], E: [], F: [] };
            const assigned = new Set();

            // Step 1: Process special bindings first
            for (const bind of lockedGroups) {
                const groupList = groups[bind.group];
                for (const name of bind.members) {
                    if (!assigned.has(name)) {
                        groupList.push(name);
                        assigned.add(name);
                    }
                }
            }

            // Step 2: Distribute remaining females evenly
            const remainingFemales = females.filter(name => !assigned.has(name));
            shuffle(remainingFemales);
            
            // Distribute females round-robin style to groups A through F
            const groupOrder = ['A', 'B', 'C', 'D', 'E', 'F'];
            let groupIndex = 0;
            
            remainingFemales.forEach(person => {
                // Find next available group in sequence
                let initialIndex = groupIndex;
                let found = false;
                
                // Try all groups in sequence, starting from current index
                while (!found) {
                    const targetGroup = groupOrder[groupIndex];
                    // Add to group if not already maxed out (3 people)
                    if (groups[targetGroup].length < 3) {
                        groups[targetGroup].push(person);
                        assigned.add(person);
                        found = true;
                    }
                    // Move to next group, wrap around if needed
                    groupIndex = (groupIndex + 1) % groupOrder.length;
                    
                    // If we've tried all groups and none have space, break
                    if (groupIndex === initialIndex) break;
                }
            });

            // Step 3: Distribute remaining males evenly
            const remainingMales = males.filter(name => !assigned.has(name));
            shuffle(remainingMales);
            
            // Reset group index to start from A again
            groupIndex = 0;
            
            remainingMales.forEach(person => {
                // Find next available group in sequence
                let initialIndex = groupIndex;
                let found = false;
                
                // Try all groups in sequence, starting from current index
                while (!found) {
                    const targetGroup = groupOrder[groupIndex];
                    // Add to group if not already maxed out (3 people)
                    if (groups[targetGroup].length < 3) {
                        groups[targetGroup].push(person);
                        assigned.add(person);
                        found = true;
                    }
                    // Move to next group, wrap around if needed
                    groupIndex = (groupIndex + 1) % groupOrder.length;
                    
                    // If we've tried all groups and none have space, break
                    if (groupIndex === initialIndex) break;
                }
            });

            // Step 4: Distribute any remaining people to groups with space
            const remainingPeople = [...females, ...males].filter(name => !assigned.has(name));
            shuffle(remainingPeople);
            
            remainingPeople.forEach(person => {
                // Find group with fewest members
                const targetGroup = Object.keys(groups).reduce((a, b) =>
                    groups[a].length <= groups[b].length ? a : b
                );
                
                if (groups[targetGroup].length < 3) {
                    groups[targetGroup].push(person);
                    assigned.add(person);
                }
            });

            // Display results
            let resultHTML = '<h3>抽籤結果：</h3><div class="groups-container">';
            for (const [groupName, members] of Object.entries(groups)) {
                resultHTML += `
                    <div class="group">
                        <h4>第${groupName}組</h4>
                        <p>${members.join('<br>')}</p>
                    </div>`;
            }
            resultHTML += '</div>';
            document.getElementById('result').innerHTML = resultHTML;
        }

        window.onload = updatePersonSelect;
    </script>
</body>
</html>
